<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glow Radial Gradients -->
    <radialGradient id="glow-purple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Text Typography Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1.5px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #e0e7ff;
    }
    .version-pill {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="340" rx="24" fill="url(#bg-grad)" />
  <rect width="1200" height="340" rx="24" fill="url(#glow-purple)" />
  <rect width="1200" height="340" rx="24" fill="url(#glow-cyan)" />
  
  <!-- Sleek Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="23" stroke="url(#border-grad)" stroke-width="1.5" fill="none" />

  <!-- Subtle Ambient Grid Dots -->
  <g opacity="0.15" fill="#ffffff">
    <circle cx="100" cy="50" r="1.5" /><circle cx="200" cy="50" r="1.5" /><circle cx="300" cy="50" r="1.5" /><circle cx="400" cy="50" r="1.5" /><circle cx="500" cy="50" r="1.5" /><circle cx="600" cy="50" r="1.5" /><circle cx="700" cy="50" r="1.5" /><circle cx="800" cy="50" r="1.5" /><circle cx="900" cy="50" r="1.5" /><circle cx="1000" cy="50" r="1.5" /><circle cx="1100" cy="50" r="1.5" />
    <circle cx="100" cy="110" r="1.5" /><circle cx="200" cy="110" r="1.5" /><circle cx="300" cy="110" r="1.5" /><circle cx="400" cy="110" r="1.5" /><circle cx="500" cy="110" r="1.5" /><circle cx="600" cy="110" r="1.5" /><circle cx="700" cy="110" r="1.5" /><circle cx="800" cy="110" r="1.5" /><circle cx="900" cy="110" r="1.5" /><circle cx="1000" cy="110" r="1.5" /><circle cx="1100" cy="110" r="1.5" />
    <circle cx="100" cy="170" r="1.5" /><circle cx="200" cy="170" r="1.5" /><circle cx="300" cy="170" r="1.5" /><circle cx="400" cy="170" r="1.5" /><circle cx="500" cy="170" r="1.5" /><circle cx="600" cy="170" r="1.5" /><circle cx="700" cy="170" r="1.5" /><circle cx="800" cy="170" r="1.5" /><circle cx="900" cy="170" r="1.5" /><circle cx="1000" cy="170" r="1.5" /><circle cx="1100" cy="170" r="1.5" />
    <circle cx="100" cy="230" r="1.5" /><circle cx="200" cy="230" r="1.5" /><circle cx="300" cy="230" r="1.5" /><circle cx="400" cy="230" r="1.5" /><circle cx="500" cy="230" r="1.5" /><circle cx="600" cy="230" r="1.5" /><circle cx="700" cy="230" r="1.5" /><circle cx="800" cy="230" r="1.5" /><circle cx="900" cy="230" r="1.5" /><circle cx="1000" cy="230" r="1.5" /><circle cx="1100" cy="230" r="1.5" />
    <circle cx="100" cy="290" r="1.5" /><circle cx="200" cy="290" r="1.5" /><circle cx="300" cy="290" r="1.5" /><circle cx="400" cy="290" r="1.5" /><circle cx="500" cy="290" r="1.5" /><circle cx="600" cy="290" r="1.5" /><circle cx="700" cy="290" r="1.5" /><circle cx="800" cy="290" r="1.5" /><circle cx="900" cy="290" r="1.5" /><circle cx="1000" cy="290" r="1.5" /><circle cx="1100" cy="290" r="1.5" />
  </g>

  <!-- Top Release Pill -->
  <g transform="translate(480, 48)">
    <rect width="240" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" />
    <circle cx="20" cy="16" r="4.5" fill="#10b981" />
    <text x="36" y="21" class="version-pill">OFFICIAL RELEASE v2.0</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="150" text-anchor="middle" class="title">VerdikOS</text>

  <!-- Subtitle Tagline -->
  <text x="600" y="195" text-anchor="middle" class="subtitle">Next-Generation Desktop Focus &amp; Time Management Operating Environment</text>

  <!-- Feature Feature Capsules -->
  <g transform="translate(195, 240)">
    <!-- Capsule 1: Kernel Defense -->
    <g transform="translate(0, 0)">
      <rect width="250" height="42" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="125" y="26" text-anchor="middle" class="badge-text">🛡️ Native Process Defense</text>
    </g>

    <!-- Capsule 2: Kiosk Lock -->
    <g transform="translate(280, 0)">
      <rect width="250" height="42" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="125" y="26" text-anchor="middle" class="badge-text">🔒 Strict Kiosk Lockdown</text>
    </g>

    <!-- Capsule 3: Auto Updates -->
    <g transform="translate(560, 0)">
      <rect width="250" height="42" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="125" y="26" text-anchor="middle" class="badge-text">⚡ Over-the-Air Updates</text>
    </g>
  </g>
</svg>
